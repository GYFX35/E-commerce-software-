<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Logistics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .main-content { flex: 1; padding: 30px; background: #ecf0f1; }
        .card { margin-bottom: 20px; border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-item { margin-bottom: 15px; cursor: pointer; color: #bdc3c7; text-decoration: none; display: block; }
        .nav-item:hover { color: white; }
        .active { color: white; font-weight: bold; }
        #map { height: 400px; width: 100%; border-radius: 10px; }
        #camera-feed { width: 100%; max-width: 400px; border-radius: 10px; background: #000; }
        #captured-image { width: 100%; max-width: 400px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>GlobalDrop AI</h2>
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="marketing_dashboard.html" class="nav-item">Marketing & Ads</a>
        <a href="pos_dashboard.html" class="nav-item">POS Integrations</a>
        <a href="security_dashboard.html" class="nav-item">Security & Trust</a>
        <a href="media_logistics_dashboard.html" class="nav-item active">Media & Logistics</a>
        <div class="nav-item">Product Sourcing</div>
        <div class="nav-item">Market Trends</div>
    </div>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Media & Logistics</h1>
        </div>

        <div class="row">
            <!-- Camera Access Feature -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-camera text-primary"></i> Product Scanner (Camera)</h5>
                    </div>
                    <div class="card-body text-center">
                        <video id="camera-feed" autoplay playsinline></video>
                        <canvas id="camera-canvas" style="display:none;"></canvas>
                        <img id="captured-image" alt="Captured product">

                        <div class="mt-3">
                            <button id="start-camera" class="btn btn-outline-primary" onclick="startCamera()">Start Camera</button>
                            <button id="capture-btn" class="btn btn-primary" onclick="captureImage()" style="display:none;">Capture & Analyze</button>
                            <button id="reset-camera" class="btn btn-secondary" onclick="resetCamera()" style="display:none;">Reset</button>
                        </div>

                        <div id="analysis-result" class="mt-4 text-start small" style="display:none;">
                            <div class="alert alert-info">
                                <h6><i class="fas fa-microscope"></i> AI Analysis Result</h6>
                                <p class="mb-1"><strong>Status:</strong> <span id="analysis-status">Processing...</span></p>
                                <p class="mb-1"><strong>Detected:</strong> <span id="analysis-detected"></span></p>
                                <p class="mb-1"><strong>Barcode:</strong> <span id="analysis-barcode"></span></p>
                                <p class="mb-0 mt-2"><strong>Recommendation:</strong> <span id="analysis-rec"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Maps Logistics Tool -->
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-map-marked-alt text-success"></i> Global Shipment Tracking</h5>
                    </div>
                    <div class="card-body">
                        <div id="map"></div>
                        <div class="mt-3">
                            <h6>Active Shipments</h6>
                            <ul id="shipment-list" class="list-group list-group-flush small">
                                <!-- Shipments loaded via API -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const API_BASE = window.location.origin.includes('localhost') ? 'http://localhost:8000' : window.location.origin;
        let map;
        let stream;

        // --- Camera Logic ---
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('camera-feed');
                video.srcObject = stream;
                document.getElementById('start-camera').style.display = 'none';
                document.getElementById('capture-btn').style.display = 'inline-block';
            } catch (err) {
                console.error("Camera error:", err);
                alert("Could not access camera. Please ensure permissions are granted.");
            }
        }

        async function captureImage() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('camera-canvas');
            const img = document.getElementById('captured-image');
            const resultDiv = document.getElementById('analysis-result');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            const dataUrl = canvas.toDataURL('image/jpeg');
            img.src = dataUrl;
            img.style.display = 'block';
            video.style.display = 'none';

            document.getElementById('capture-btn').style.display = 'none';
            document.getElementById('reset-camera').style.display = 'inline-block';

            resultDiv.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/media/analyze-image`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image_data: dataUrl })
                });
                const data = await response.json();

                document.getElementById('analysis-status').textContent = 'Success';
                document.getElementById('analysis-detected').textContent = data.detected_objects.join(', ');
                document.getElementById('analysis-barcode').textContent = data.barcode_value;
                document.getElementById('analysis-rec').textContent = data.recommendation;
            } catch (err) {
                document.getElementById('analysis-status').textContent = 'Error during analysis';
            }
        }

        function resetCamera() {
            document.getElementById('camera-feed').style.display = 'block';
            document.getElementById('captured-image').style.display = 'none';
            document.getElementById('capture-btn').style.display = 'inline-block';
            document.getElementById('reset-camera').style.display = 'none';
            document.getElementById('analysis-result').style.display = 'none';
        }

        // --- Map Logic ---
        function initMap() {
            map = L.map('map').setView([20, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            loadShipments();
        }

        async function loadShipments() {
            const list = document.getElementById('shipment-list');
            try {
                const response = await fetch(`${API_BASE}/logistics/shipments`);
                const shipments = await response.json();

                list.innerHTML = '';
                shipments.forEach(s => {
                    // Add marker to map
                    L.marker(s.coords).addTo(map)
                        .bindPopup(`<b>${s.id}</b><br>${s.destination}<br>Status: ${s.status}`);

                    // Add to list
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        <div>
                            <strong>${s.id}</strong> - ${s.destination}
                            <div class="text-muted" style="font-size: 0.75rem;">ETA: ${s.eta}</div>
                        </div>
                        <span class="badge rounded-pill ${s.status === 'Delivered' ? 'bg-success' : 'bg-primary'}">${s.status}</span>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                list.innerHTML = '<li class="list-group-item text-danger">Error loading shipments</li>';
            }
        }

        window.onload = () => {
            initMap();
        };
    </script>
</body>
</html>
