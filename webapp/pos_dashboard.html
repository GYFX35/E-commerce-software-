<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Integrations Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .main-content { flex: 1; padding: 30px; background: #ecf0f1; }
        .card { margin-bottom: 20px; }
        .nav-item { margin-bottom: 15px; cursor: pointer; color: #bdc3c7; text-decoration: none; display: block; }
        .nav-item:hover { color: white; }
        .active { color: white; font-weight: bold; }
        .pos-card { transition: transform 0.2s; }
        .pos-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>GlobalDrop AI</h2>
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="marketing_dashboard.html" class="nav-item">Marketing & Ads</a>
        <a href="pos_dashboard.html" class="nav-item active">POS Integrations</a>
        <a href="security_dashboard.html" class="nav-item">Security & Trust</a>
        <div class="nav-item">Product Sourcing</div>
        <div class="nav-item">Market Trends</div>
    </div>
    <div class="main-content">
        <h1>POS Integrations</h1>
        <p class="text-muted">Connect and sync your physical store POS systems with your e-commerce ecosystem.</p>

        <div id="pos-container" class="row">
            <!-- POS Cards will be loaded here -->
        </div>

        <div class="mt-4">
            <h3>Recent Sync Activity</h3>
            <div class="card">
                <div class="card-body">
                    <ul id="sync-logs" class="list-group list-group-flush">
                        <li class="list-group-item">No recent activity.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Connect Modal -->
    <div class="modal fade" id="connectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Connect to <span id="modal-provider-name"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">API Key</label>
                        <input type="password" id="api-key" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Merchant ID (Optional)</label>
                        <input type="text" id="merchant-id" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" onclick="submitConnection()" class="btn btn-primary">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000';
        let currentProvider = '';
        const connectModal = new bootstrap.Modal(document.getElementById('connectModal'));

        async function loadPOSStatus() {
            const container = document.getElementById('pos-container');
            try {
                const response = await fetch(`${API_BASE}/pos/status`);
                const statuses = await response.json();

                container.innerHTML = statuses.map(pos => `
                    <div class="col-md-4 mb-3">
                        <div class="card pos-card h-100">
                            <div class="card-body">
                                <h5 class="card-title d-flex justify-content-between">
                                    ${pos.provider}
                                    <span class="badge ${pos.connected ? 'bg-success' : 'bg-secondary'}">${pos.status}</span>
                                </h5>
                                <p class="card-text text-muted small">Last Sync: ${pos.last_sync || 'Never'}</p>
                                <div class="mt-3">
                                    ${pos.connected ?
                                        `<button onclick="syncPOS('${pos.provider}')" class="btn btn-sm btn-outline-primary">Sync Now</button>
                                         <button onclick="viewSales('${pos.provider}')" class="btn btn-sm btn-outline-info">Sales Data</button>` :
                                        `<button onclick="openConnectModal('${pos.provider}')" class="btn btn-sm btn-primary">Connect</button>`
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { container.innerHTML = '<p class="text-danger">Error loading POS status.</p>'; }
        }

        function openConnectModal(provider) {
            currentProvider = provider;
            document.getElementById('modal-provider-name').textContent = provider;
            connectModal.show();
        }

        async function submitConnection() {
            const apiKey = document.getElementById('api-key').value;
            const merchantId = document.getElementById('merchant-id').value;

            try {
                const response = await fetch(`${API_BASE}/pos/connect`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ provider: currentProvider, api_key: apiKey, merchant_id: merchantId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message);
                    connectModal.hide();
                    loadPOSStatus();
                } else {
                    alert(data.detail);
                }
            } catch (e) { alert('Failed to connect.'); }
        }

        async function syncPOS(provider) {
            try {
                const response = await fetch(`${API_BASE}/pos/sync/${provider}`, { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    const log = document.getElementById('sync-logs');
                    if (log.innerHTML.includes('No recent activity')) log.innerHTML = '';
                    const newEntry = document.createElement('li');
                    newEntry.className = 'list-group-item';
                    newEntry.innerHTML = `<strong>${data.provider}</strong> synced ${data.items_synced} items at ${new Date(data.timestamp).toLocaleTimeString()}`;
                    log.prepend(newEntry);
                    loadPOSStatus();
                }
            } catch (e) { alert('Sync failed.'); }
        }

        async function viewSales(provider) {
            try {
                const response = await fetch(`${API_BASE}/pos/sales/${provider}`);
                const data = await response.json();
                alert(`Sales Data for ${provider}:\nRevenue: $${data.daily_revenue}\nTransactions: ${data.transactions_count}\nTop Item: ${data.top_selling_item}`);
            } catch (e) { alert('Failed to fetch sales data.'); }
        }

        window.onload = loadPOSStatus;
    </script>
</body>
</html>
